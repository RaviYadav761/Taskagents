<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Taskly Automation Controller</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F3ED;
      color: #1E2022;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
    }
    .title {
      font-size: 15px;
      font-weight: 800;
    }
    .subtitle {
      font-size: 11px;
      color: #737373;
    }
    .card {
      background: white;
      border: 1px solid #E2DDD3;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .site-title {
      font-size: 13px;
      font-weight: 800;
      color: #111;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
      color: #555;
    }
    .stat-val {
      font-weight: 700;
      color: #111;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
    }
    .badge-ok { background: #EAF7EE; color: #22864E; }
    .badge-warn { background: #FFF5E6; color: #D97706; }
    .badge-lock { background: #FEECEB; color: #DC2626; }
    .badge-need-perm { background: #EFF6FF; color: #2563EB; }
    .perm-btn {
      width: 100%;
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .perm-btn:hover {
      background: #1D4ED8;
    }
    .refresh-btn {
      background: transparent;
      border: 1px solid #E2DDD3;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: #555;
    }
    .pairing-box {
      font-size: 11px;
      color: #666;
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .pairing-input {
      flex: 1;
      border: 1px solid #E2DDD3;
      border-radius: 8px;
      padding: 6px;
      font-size: 11px;
      outline: none;
    }
    .pair-btn {
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .footer {
      font-size: 10px;
      color: #888;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">T</div>
      <div>
        <div class="title">Taskly Controller</div>
        <div class="subtitle">Mindful Usage & Site Limiter</div>
      </div>
    </div>
    <button id="refresh-btn" class="refresh-btn">Sync</button>
  </div>

  <div id="rules-container">
    <div style="font-size: 12px; color: #666; text-align: center; padding: 20px;">Loading website rules...</div>
  </div>

  <div class="card" style="margin-top: 12px;">
    <div style="font-size: 11px; font-weight: 700; color: #737373; text-transform: uppercase; margin-bottom: 4px;">Account Link</div>
    <div id="account-status" style="font-size: 12px; font-weight: 600; color: #111; margin-bottom: 6px;">Connected to Taskly</div>
    <div class="pairing-box">
      <input id="pair-token-input" class="pairing-input" type="text" placeholder="Enter EXT-XXXX Code or JWT" />
      <button id="save-pair-btn" class="pair-btn">Link</button>
    </div>
  </div>

  <div class="footer">
    Active-tab tracking • Offline buffer protection • Taskly
  </div>

  <script src="popup.js"></script>
</body>
</html>
